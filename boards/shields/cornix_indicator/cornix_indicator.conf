# Cornix status indicator: drive the 2 WS2812 LEDs with the in-repo
# manual-style indicator (boards/jzf/cornix/status_led.c).

## WS2812 over SPI (driver auto-enabled by LED_STRIP + the DT ws2812-spi node)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

## Custom status indicator (manual-style scheme)
CONFIG_CORNIX_STATUS_LED=y
CONFIG_CORNIX_STATUS_LED_BRIGHTNESS=64

## Charging (green) indication needs USB VBUS detection (CONFIG_ZMK_USB).
## The left/central half already enables USB; the right/peripheral half ships
## with CONFIG_ZMK_USB=n ("never output usb"). To also show charging on the
## right half, override it there (uncomment below) — note this makes the right
## half enumerate as a USB device when plugged in:
# CONFIG_ZMK_USB=y
