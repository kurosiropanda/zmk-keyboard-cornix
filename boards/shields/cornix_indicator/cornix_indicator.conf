# Cornix status indicator: drive the 2 WS2812 LEDs with the in-repo
# manual-style indicator (boards/jzf/cornix/status_led.c).

## WS2812 over SPI (driver auto-enabled by LED_STRIP + the DT ws2812-spi node)
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

## Custom status indicator (manual-style scheme)
CONFIG_CORNIX_STATUS_LED=y
CONFIG_CORNIX_STATUS_LED_BRIGHTNESS=64

## NOTE: do NOT enable CONFIG_ZMK_USB on the right/peripheral half — it runs the
## USB device stack and measurably slows key input over the split link, and on a
## peripheral zmk_usb_is_powered() returns false anyway. The right half instead
## reads the nRF USBREGSTATUS VBUS-detect register directly for charging (see
## vbus_present() in status_led.c), which needs no USB stack. The left/central
## half keeps CONFIG_ZMK_USB=y from its board defconfig.
